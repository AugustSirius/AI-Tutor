# Nginx Configuration for aidamcell.com
# Place this file in /etc/nginx/sites-available/aidamcell.com
# Then create symlink: ln -s /etc/nginx/sites-available/aidamcell.com /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    
    server_name aidamcell.com www.aidamcell.com;
    
    root /var/www/aidamcell.com;
    index index.html;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    
    location / {
        try_files $uri $uri/ =404;
    }
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

