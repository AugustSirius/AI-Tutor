<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Teaching Assistant - Enhanced</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f9f9f9;
            color: #2c2c2c;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 300px;
            background: white;
            border-right: 1px solid #e5e5e5;
            overflow-y: auto;
            padding: 20px;
        }

        .sidebar h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sidebar-section {
            margin-bottom: 20px;
        }

        .sidebar-item {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .sidebar-item:hover {
            background: #ebebeb;
        }

        .sidebar-item-title {
            font-size: 13px;
            font-weight: 500;
        }

        .sidebar-item-icon {
            color: #666;
            font-size: 18px;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .header {
            padding: 20px 30px;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .cache-indicator {
            font-size: 12px;
            color: #666;
            background: #f0f0f0;
            padding: 4px 12px;
            border-radius: 12px;
        }

        .cache-indicator.enabled {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
        }

        .message {
            margin-bottom: 25px;
            display: flex;
            gap: 15px;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }

        .message.user .avatar {
            background: #2c2c2c;
            color: white;
        }

        .message.assistant .avatar {
            background: #e5e5e5;
            color: #2c2c2c;
        }

        .message-content {
            max-width: 70%;
            line-height: 1.6;
        }

        .message.user .message-content {
            background: #2c2c2c;
            color: white;
            padding: 12px 16px;
            border-radius: 18px;
        }

        .message.assistant .message-content {
            padding: 12px 0;
        }

        /* Markdown styling */
        .message-content h1, .message-content h2, .message-content h3 {
            margin-top: 16px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .message-content h1 { font-size: 24px; }
        .message-content h2 { font-size: 20px; }
        .message-content h3 { font-size: 18px; }

        .message-content p {
            margin-bottom: 12px;
        }

        .message-content ul, .message-content ol {
            margin-left: 20px;
            margin-bottom: 12px;
        }

        .message-content li {
            margin-bottom: 6px;
        }

        .message-content code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .message-content pre {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
        }

        .message-content pre code {
            background: none;
            padding: 0;
        }

        .message-content blockquote {
            border-left: 3px solid #e5e5e5;
            padding-left: 15px;
            margin: 12px 0;
            color: #666;
        }

        .message-content hr {
            border: none;
            border-top: 1px solid #e5e5e5;
            margin: 20px 0;
        }

        .message-content strong {
            font-weight: 600;
        }

        .message-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 12px 0;
        }

        .message-content th, .message-content td {
            border: 1px solid #e5e5e5;
            padding: 8px;
            text-align: left;
        }

        .message-content th {
            background: #f5f5f5;
            font-weight: 600;
        }

        /* Thinking block */
        .thinking-block {
            background: #f8f9fa;
            border-left: 3px solid #6c757d;
            padding: 12px 16px;
            margin: 12px 0;
            border-radius: 4px;
            font-size: 14px;
            color: #495057;
        }

        .thinking-label {
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            color: #6c757d;
            margin-bottom: 6px;
        }

        /* Cost report styling */
        .cost-report {
            background: #fff3e0;
            border-left: 3px solid #ff9800;
            padding: 12px 16px;
            margin-top: 16px;
            border-radius: 4px;
            font-size: 13px;
        }

        .input-container {
            padding: 20px 30px;
            border-top: 1px solid #e5e5e5;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
            background: #f5f5f5;
            border-radius: 24px;
            padding: 10px 20px;
        }

        .input-wrapper:focus-within {
            background: #ebebeb;
        }

        #messageInput {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 15px;
            outline: none;
            font-family: inherit;
        }

        #sendButton {
            background: #2c2c2c;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        #sendButton:hover {
            background: #1a1a1a;
        }

        #sendButton:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal.active {
            display: block;
        }

        .modal-content {
            background: white;
            max-width: 900px;
            margin: 40px auto;
            padding: 40px;
            border-radius: 12px;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: #666;
            background: none;
            border: none;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            color: #2c2c2c;
        }

        .markdown-content {
            line-height: 1.8;
            color: #2c2c2c;
        }

        .markdown-content h1 {
            font-size: 28px;
            margin: 30px 0 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e5e5e5;
        }

        .markdown-content h2 {
            font-size: 24px;
            margin: 25px 0 15px;
        }

        .markdown-content h3 {
            font-size: 20px;
            margin: 20px 0 12px;
        }

        .markdown-content p {
            margin: 12px 0;
        }

        .markdown-content ul, .markdown-content ol {
            margin: 12px 0;
            padding-left: 30px;
        }

        .markdown-content li {
            margin: 8px 0;
        }

        .markdown-content code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .markdown-content pre {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 15px 0;
        }

        .markdown-content pre code {
            background: none;
            padding: 0;
        }

        .markdown-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 15px 0;
        }

        .markdown-content th, .markdown-content td {
            border: 1px solid #e5e5e5;
            padding: 12px;
            text-align: left;
        }

        .markdown-content th {
            background: #f5f5f5;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            
            .message-content {
                max-width: 85%;
            }

            .modal-content {
                margin: 20px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-section">
                <h3>Resources</h3>
                
                <div class="sidebar-item" onclick="showModal('systemPrompt')">
                    <span class="sidebar-item-title">System Prompt</span>
                    <span class="sidebar-item-icon">→</span>
                </div>
                
                <div class="sidebar-item" onclick="showModal('classMaterials')">
                    <span class="sidebar-item-title">Class Materials</span>
                    <span class="sidebar-item-icon">→</span>
                </div>
            </div>
            
            <div class="sidebar-section">
                <h3>About Project</h3>
                
                <div class="sidebar-item" onclick="showModal('projectPlanShort')">
                    <span class="sidebar-item-title">课程助教方案（精简版）</span>
                    <span class="sidebar-item-icon">📋</span>
                </div>
                
                <div class="sidebar-item" onclick="showModal('projectPlanFull')">
                    <span class="sidebar-item-title">课程助教方案（完整版）</span>
                    <span class="sidebar-item-icon">📄</span>
                </div>
                
                <div class="sidebar-item" onclick="showModal('costVerification')">
                    <span class="sidebar-item-title">成本验证</span>
                    <span class="sidebar-item-icon">💰</span>
                </div>
            </div>
            
            <div class="sidebar-section">
                <h3>Settings</h3>
                
                <div class="sidebar-item" onclick="checkHealth()">
                    <span class="sidebar-item-title">System Status</span>
                    <span class="sidebar-item-icon">🔍</span>
                </div>
            </div>
        </div>

        <div class="main">
            <div class="header">
                <h1>AI Teaching Assistant</h1>
                <div class="cache-indicator enabled" id="cacheIndicator">💾 Cache: ON</div>
            </div>

            <div class="chat-container" id="chatContainer">
                <div class="message assistant">
                    <div class="avatar">AI</div>
                    <div class="message-content">
                        <p>Hello! I'm your AI teaching assistant with <strong>enhanced caching</strong> for cost optimization. 💾</p>
                        <p>How can I help you today?</p>
                    </div>
                </div>
            </div>

            <div class="input-container">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="messageInput" 
                        placeholder="Type your message..."
                        autocomplete="off"
                    />
                    <button id="sendButton">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for displaying content -->
    <div class="modal" id="contentModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">×</button>
            <div class="markdown-content" id="modalContent"></div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        
        let conversationHistory = [];
        let sessionId = 'session_' + Date.now();

        // Load all resources
        let systemPromptContent = '';
        let classMaterialsContent = '';
        let projectPlanShortContent = '';
        let projectPlanFullContent = '';
        let costVerificationContent = '';

        async function loadResources() {
            try {
                // Load existing resources
                const [systemResponse, materialsResponse] = await Promise.all([
                    fetch('/system_prompt.txt'),
                    fetch('/class_materials.txt')
                ]);
                
                systemPromptContent = systemResponse.ok ? await systemResponse.text() : 'System prompt not available';
                classMaterialsContent = materialsResponse.ok ? await materialsResponse.text() : 'Class materials not available';
                
                // Load project documents (these may not exist yet)
                try {
                    const planShortResponse = await fetch('/AI课程助教方案-精简版.md');
                    projectPlanShortContent = planShortResponse.ok ? await planShortResponse.text() : '# AI 课程助教方案（精简版）\n\n暂无内容';
                } catch (e) {
                    projectPlanShortContent = '# AI 课程助教方案（精简版）\n\n暂无内容';
                }
                
                try {
                    const planFullResponse = await fetch('/AI课程助教方案.md');
                    projectPlanFullContent = planFullResponse.ok ? await planFullResponse.text() : '# AI 课程助教方案（完整版）\n\n暂无内容';
                } catch (e) {
                    projectPlanFullContent = '# AI 课程助教方案（完整版）\n\n暂无内容';
                }
                
                try {
                    const costResponse = await fetch('/成本验证.md');
                    costVerificationContent = costResponse.ok ? await costResponse.text() : '# 成本验证\n\n暂无内容';
                } catch (e) {
                    costVerificationContent = '# 成本验证\n\n暂无内容';
                }
            } catch (error) {
                console.error('Error loading resources:', error);
            }
        }

        async function checkHealth() {
            try {
                const response = await fetch('/health');
                const data = await response.json();
                const tiktokenStatus = data.tiktoken_available ? '✅ tiktoken (accurate)' : '⚠️ approximation';
                alert(`✅ System Status:\n\nModel: ${data.model}\nCaching: ${data.caching_enabled ? 'Enabled ✅' : 'Disabled ❌'}\nCached Size: ${data.cached_size.toLocaleString()} tokens\nToken Counter: ${tiktokenStatus}`);
            } catch (error) {
                alert('❌ Failed to check system status');
            }
        }

        function showModal(type) {
            const modal = document.getElementById('contentModal');
            const modalContent = document.getElementById('modalContent');
            
            let content = '';
            if (type === 'systemPrompt') {
                content = systemPromptContent;
            } else if (type === 'classMaterials') {
                content = classMaterialsContent;
            } else if (type === 'projectPlanShort') {
                content = projectPlanShortContent;
            } else if (type === 'projectPlanFull') {
                content = projectPlanFullContent;
            } else if (type === 'costVerification') {
                content = costVerificationContent;
            }
            
            modalContent.innerHTML = marked.parse(content);
            modal.classList.add('active');
            
            modal.onclick = function(e) {
                if (e.target === modal) {
                    closeModal();
                }
            };
        }

        function closeModal() {
            const modal = document.getElementById('contentModal');
            modal.classList.remove('active');
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        function addMessage(content, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = isUser ? 'U' : 'AI';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            if (isUser) {
                contentDiv.textContent = content;
            } else {
                contentDiv.innerHTML = '';
            }
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            return contentDiv;
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            addMessage(message, true);
            conversationHistory.push({role: 'user', content: message});
            
            messageInput.value = '';
            sendButton.disabled = true;

            const assistantDiv = addMessage('', false);
            let fullResponse = '';
            let thinkingBlock = null;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        message: message,
                        history: conversationHistory,
                        session_id: sessionId
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const {done, value} = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                
                                if (data.type === 'thinking_start') {
                                    thinkingBlock = document.createElement('div');
                                    thinkingBlock.className = 'thinking-block';
                                    thinkingBlock.innerHTML = '<div class="thinking-label">💭 Thinking...</div><div class="thinking-content"></div>';
                                    assistantDiv.appendChild(thinkingBlock);
                                }
                                else if (data.type === 'thinking' && thinkingBlock) {
                                    const thinkingContent = thinkingBlock.querySelector('.thinking-content');
                                    thinkingContent.textContent += data.content;
                                }
                                else if (data.type === 'thinking_end') {
                                    thinkingBlock = null;
                                }
                                else if (data.type === 'content') {
                                    fullResponse += data.content;
                                    assistantDiv.innerHTML = marked.parse(fullResponse);
                                    chatContainer.scrollTop = chatContainer.scrollHeight;
                                }
                                else if (data.type === 'cost_report') {
                                    const costDiv = document.createElement('div');
                                    costDiv.className = 'cost-report';
                                    costDiv.innerHTML = marked.parse(data.content);
                                    assistantDiv.appendChild(costDiv);
                                    chatContainer.scrollTop = chatContainer.scrollHeight;
                                }
                                else if (data.type === 'error') {
                                    assistantDiv.innerHTML = `<p style="color: red;">❌ Error: ${data.content}</p>`;
                                }
                            } catch (e) {
                                console.error('Parse error:', e);
                            }
                        }
                    }
                }

                conversationHistory.push({role: 'assistant', content: fullResponse});

            } catch (error) {
                assistantDiv.innerHTML = '<p style="color: red;">Sorry, there was an error processing your request.</p>';
                console.error('Error:', error);
            } finally {
                sendButton.disabled = false;
                messageInput.focus();
            }
        }

        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Load resources on page load
        loadResources();
    </script>
</body>
</html>
